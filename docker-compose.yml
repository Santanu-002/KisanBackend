# Docker Compose stack for Kisan Backend

services:
  db:
    image: postgres:16-alpine
    container_name: kisan-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kisan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kisan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kisan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: kisan-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Mount local source so edits are picked up without rebuild
    environment:
      # These overrides are now managed via the .env file for a single source of truth
      - APP_ENV=docker
    # Use the .env file as a primary config source
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
